[project]
name = "aa-crawler"
version = "0.2.0"
description = "Leaderboard crawler for artificialanalysis.ai"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.5.1",
    "httpx>=0.28",
    "parsel>=1.12.1",
    "pydantic>=2.14.4",
    "tqdm>=4.70.1",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[project.scripts]
aa-crawler = "aa_crawler.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aa_crawler"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
